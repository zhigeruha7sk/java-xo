plugins {
    id 'application'
    id 'checkstyle'
}

group = 'io.hexlet'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    if (file('local-repo').exists()) {
        maven { url = uri('local-repo') }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

compileJava {
    options.release = 17
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'io.hexlet.xo.XOCLI'
}

checkstyle {
    toolVersion = '10.21.1'
}

run {
    standardInput = System.in
}
